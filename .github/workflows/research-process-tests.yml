name: Research Process Checks
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'supabase/morning_scheduler.sql'
      - 'supabase/afternoon_scheduler.sql'
      - 'docs/assets/briefing-picks.js'
      - 'docs/research/daily-process.html'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests==2.32.5
      - run: python scripts/build_daily_process.py --check
      - run: node tests/briefing_picks.cjs
      - run: node tests/research_state.cjs
      - run: python -m unittest discover -s tests -p 'test_research*.py'
      - run: python -m unittest discover -s tests -p 'test_analyst_review.py'
      - run: python -m unittest discover -s tests -p 'test_morning*.py'
      - run: python -m unittest discover -s tests -p 'test_afternoon*.py'
      - name: Test independent morning and afternoon schedulers in isolated PostgreSQL
        run: |
          npm install --prefix /tmp/fv-morning-db @electric-sql/pglite@0.5.8
          FV_PGLITE=/tmp/fv-morning-db/node_modules/@electric-sql/pglite node tests/morning_scheduler.cjs
          FV_PGLITE=/tmp/fv-morning-db/node_modules/@electric-sql/pglite node tests/afternoon_scheduler.cjs
