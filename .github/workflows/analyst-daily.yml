name: Morning Candidate Research

on:
  workflow_dispatch:
    inputs:
      test_edition:
        description: 'Explicit test edition outside the morning window (same daily allowance)'
        type: boolean
        default: false
      replace_card:
        description: 'Replace the public card after archiving the previous edition'
        type: boolean
        default: false
  workflow_call:
    inputs:
      refresh_results:
        type: string
        default: '{}'
      reused_sports:
        description: 'Comma-separated sports whose unchanged feed a recovery start reused'
        type: string
        default: ''
      test_edition:
        type: boolean
        default: false
      replace_card:
        type: boolean
        default: false

# NHL and this workflow serialize their reservations against one combined cap.
concurrency:
  group: analyst-reviews
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests==2.32.5
      - name: Verify selection and research boundaries
        run: |
          node tests/briefing_picks.cjs
          python -m unittest discover -s tests -p 'test_analyst_review.py'
          python -m unittest discover -s tests -p 'test_morning*.py'
          python -m unittest discover -s tests -p 'test_research*.py'
          python -m unittest discover -s tests -p 'test_nhl_injuries.py'
          node tests/research_state.cjs
      - name: Discover opportunities and research the current candidate pool
        id: research
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TEST_EDITION: ${{ inputs.test_edition || false }}
          REPLACE_CARD: ${{ inputs.replace_card || false }}
          REFRESH_RESULTS: ${{ inputs.refresh_results || '{}' }}
          REUSED_SPORTS: ${{ inputs.reused_sports || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=(--astra --publish-card --refresh-results "$REFRESH_RESULTS" --reused-sports "$REUSED_SPORTS")
          if [ "$TEST_EDITION" = 'true' ]; then args+=(--test-edition); fi
          if [ "$REPLACE_CARD" = 'true' ]; then args+=(--replace-card); fi
          python scripts/analyst_review.py "${args[@]}"
      - name: Archive reproducible research packets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-research-${{ github.run_id }}
          path: |
            artifacts/analyst/
            artifacts/research/
          retention-days: 90
      - name: Publish reviews and durable spending ledger
        run: |
          git config user.name 'Fourth & Value Research'
          git config user.email 'actions@github.com'
          git add docs/briefing/reviews.json docs/briefing/discovery.json docs/nhl/data/candidates.json artifacts/analyst/
          # Frozen decision ledgers and NHL pilot records (immutable evaluation inputs).
          if [ -d artifacts/research ]; then git add artifacts/research/; fi
          if [ -f docs/briefing/morning-card.json ]; then git add docs/briefing/morning-card.json docs/briefing/cards/; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Research: publish multi-sport discovery and candidate reviews'
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo '::error::Concurrent edit needs review; research is retained in artifacts.'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Rebuild public site only if this edition is not already live
        if: steps.research.outputs.edition_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_EDITION: ${{ steps.research.outputs.edition_id }}
        run: |
          if python scripts/morning_operations.py --verify-live "$EXPECTED_EDITION" --attempts 1; then exit 0; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status
      - name: Verify this exact edition is live
        if: steps.research.outputs.edition_id != ''
        env:
          EXPECTED_EDITION: ${{ steps.research.outputs.edition_id }}
        run: python scripts/morning_operations.py --verify-live "$EXPECTED_EDITION"
      - name: Fail incomplete or unverified research runs
        if: always() && !cancelled()
        env:
          RESEARCH_OUTCOME: ${{ steps.research.outcome }}
          EXPECTED_EDITION: ${{ steps.research.outputs.edition_id }}
        run: |
          if [ "$RESEARCH_OUTCOME" != 'success' ] || [ -z "$EXPECTED_EDITION" ]; then
            echo '::error::Morning research did not complete. See the archived diagnostics; recovery starts may retry within the same daily budget.'
            exit 1
          fi
