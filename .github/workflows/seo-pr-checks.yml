name: SEO Policy Checks
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'SEO_POLICY.md'
      - 'tests/seo_baseline.json'
      - 'tests/test_seo_policy.py'
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Changed pages meet SEO_POLICY.md
        run: python scripts/seo_check.py --check --base origin/${{ github.base_ref }}
      - name: Site-wide baseline and helpers
        run: python -m unittest discover -s tests -p 'test_seo_policy.py'
