name: Goalie source probe (temporary)
on:
  push:
    branches: [claude/amazing-albattani-kui7sr]
    paths: ['.github/workflows/goalie-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-nhl.txt
      - run: pip install -r requirements-nhl.txt
      - name: Dry run of goalie projections on live data (no odds calls, nothing published)
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, 'scripts')
          from datetime import datetime, timezone
          from nhl.v2.inference import live_history
          from nhl.v2 import goalies
          from nhl.refresh import schedule, season_for
          now = datetime.now(timezone.utc)
          games, players, checked = live_history(now)
          apps = goalies.live('data/nhl/v2/history', games, now, season_for(now))
          print('appearances', len(apps), 'by season', {s: sum(a['season'] == s for a in apps) for s in sorted({a['season'] for a in apps})})
          events = schedule(now)
          up = goalies.upcoming(events, now)
          rost = goalies.rosters(events, now)
          print('games in 48h', len(up), 'rosters', len(rost))
          state = goalies.attach(dict(events=events, rows=[dict(nhl_game_id=e['nhl_game_id'], player='') for e in up]), apps, now, rost)
          for row in state['rows']:
              print(row['nhl_game_id'], row['goalie_assumption'], len(row['goalie_assumption']))
          p = next(iter(state['goalie_projections'].values()), None)
          if p: print('basis', (p['home'] or {}).get('basis'))
          PY
