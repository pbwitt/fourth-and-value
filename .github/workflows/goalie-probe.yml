name: Goalie source probe (temporary)
# One-off research job: looks for Nation Network terms that would cover Daily Faceoff and
# records the starting-goalies page layout. Prints to the log only; no secrets, no odds credits.
on:
  push:
    branches: [claude/amazing-albattani-kui7sr]
    paths: ['.github/workflows/goalie-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Terms check and page layout
        shell: python
        run: |
          import html, json, re, time, urllib.request
          UA = 'FourthAndValue-research/1.0 (+https://fourthandvalue.com)'
          def get(url):
              time.sleep(2)
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': '*/*'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.geturl(), dict(r.headers), r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, url, dict(e.headers or {}), ''
              except Exception as e:
                  return None, url, {}, f'ERROR {type(e).__name__}: {e}'
          def text(page):
              page = re.sub(r'(?is)<(script|style|noscript)\b.*?</\1>', ' ', page)
              page = re.sub(r'(?s)<[^>]+>', '\n', page)
              return [l for l in (' '.join(html.unescape(x).split()) for x in page.splitlines()) if l]
          def banner(t): print('\n' + '=' * 90 + f'\n{t}\n' + '=' * 90, flush=True)
          WORDS = re.compile(r'scrap|crawl|spider|robot|automat|data min|harvest|extract|reproduc|'
                             r'redistribut|commercial|personal use|license|bot\b|artificial|terms of (use|service)', re.I)
          def show(url):
              status, final, headers, page = get(url)
              banner(f'{url} -> {status} {final} ({len(page)} chars)')
              if status != 200: return page
              lines = text(page)
              hits = [i for i, l in enumerate(lines) if WORDS.search(l)]
              for i in hits[:60]: print(lines[i][:600])
              if not hits: print('(no scraping/terms language)')
              return page

          banner('1. Links on the starting-goalies page (HTML and embedded JSON)')
          status, final, headers, page = get('https://www.dailyfaceoff.com/starting-goalies')
          print(status, final, len(page), 'X-Robots-Tag:', headers.get('X-Robots-Tag') or headers.get('x-robots-tag'))
          print('meta robots:', re.findall(r'(?i)<meta[^>]+name=["\']robots["\'][^>]*>', page))
          links = sorted(set(re.findall(r'https?://[^\s"\'<>\\]+|href=["\'](/[^"\']+)["\']', page)), key=str)
          flat = sorted({l if isinstance(l, str) else l for l in re.findall(r'(?:https?://[^\s"\'<>\\]+|/[A-Za-z0-9_\-/]+)', page)
                         if re.search(r'term|legal|condition|tos\b|policy|privacy|about|contact', l, re.I)})
          print('term/legal/policy links:', flat[:40])
          print('visible text mentioning terms:', [l for l in text(page) if re.search(r'terms|conditions|all rights', l, re.I)][:10])
          layout = page

          banner('2. Daily Faceoff privacy policy: references to any terms document')
          status, final, headers, page = get('https://www.dailyfaceoff.com/privacy-policy')
          for l in text(page):
              if re.search(r'terms|scrap|automat|crawl|robot|commercial', l, re.I): print(l[:500])

          banner('3. Other Daily Faceoff and Nation Network terms locations')
          for url in ['https://www.dailyfaceoff.com/legal', 'https://www.dailyfaceoff.com/terms-and-conditions',
                      'https://www.dailyfaceoff.com/about', 'https://www.dailyfaceoff.com/llms.txt', 'https://www.dailyfaceoff.com/ai.txt',
                      'https://thenationnetwork.com/', 'https://www.thenationnetwork.com/terms-of-use',
                      'https://oilersnation.com/terms-of-use', 'https://oilersnation.com/terms', 'https://oilersnation.com/terms-of-service',
                      'https://oilersnation.com/privacy-policy']:
              page = show(url)
              if url.endswith('nation.com/') or url.endswith('network.com/'):
                  print('links:', sorted({h for h in re.findall(r'href=["\']([^"\']+)["\']', page) if re.search(r'term|legal|condition|privacy', h, re.I)})[:20])

          banner('4. Starting-goalies page layout (for the parser)')
          m = re.search(r'(?s)<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', layout)
          if m:
              data = json.loads(m.group(1))
              props = data['props']['pageProps']
              print('pageProps keys:', sorted(props))
              print('page/query:', data.get('page'), data.get('query'), 'buildId:', data.get('buildId'))
              games = props.get('data') or []
              print('games:', len(games))
              if games:
                  print('game keys:', sorted(games[0]))
              for g in games:
                  print(json.dumps({k: g.get(k) for k in sorted(g) if not re.search(r'Url|Rating|Rank|Cap|Contract|Salary|Wins|Losses|Shutouts|Percentage|Avg|Score|Details', k)}))
              for k, v in props.items():
                  if k != 'data' and not isinstance(v, (list, dict)): print('prop', k, '=', str(v)[:200])
          for d in ['2026-10-06', '2026-10-07']:
              status, final, headers, page = get(f'https://www.dailyfaceoff.com/starting-goalies/{d}')
              m = re.search(r'(?s)<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', page)
              n = len(json.loads(m.group(1))['props']['pageProps'].get('data') or []) if m else None
              print('dated page', d, status, final, 'games:', n)
