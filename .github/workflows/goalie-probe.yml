name: Goalie source probe (temporary)
on:
  push:
    branches: [claude/amazing-albattani-kui7sr]
    paths: ['.github/workflows/goalie-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-nhl.txt
      - run: pip install -r requirements-nhl.txt
      - name: Roster responses per team (no odds calls)
        run: |
          python - <<'PY'
          import sys, time; sys.path.insert(0, 'scripts')
          from datetime import datetime, timezone
          import requests
          from nhl.v2 import goalies
          from nhl.refresh import schedule
          now = datetime.now(timezone.utc)
          up = goalies.upcoming(schedule(now), now)
          teams = []
          for e in up:
              for side in ('home', 'away'):
                  pair = (e[side + '_id'], e.get(side + '_abbrev'), e[side + '_team'])
                  if pair not in teams: teams.append(pair)
          print('teams', len(teams))
          for tid, abbrev, name in teams:
              t = time.time()
              try:
                  r = requests.get(f'https://api-web.nhle.com/v1/roster/{abbrev}/current', timeout=10)
                  body = r.json() if r.ok else r.text[:120]
                  print(tid, abbrev, name, r.status_code, round(time.time() - t, 2), [g['id'] for g in body['goalies']] if r.ok else body, r.headers.get('Retry-After'))
              except Exception as error:
                  print(tid, abbrev, name, 'ERROR', type(error).__name__, str(error)[:120])
          PY
