name: Prediction Market Snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prediction-market-snapshot
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Observe public market data
        id: observe
        continue-on-error: true
        run: python scripts/refresh_prediction_markets.py
      - name: Preserve dated observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-observation-${{ github.run_id }}
          path: data/prediction-markets/snapshots/
          retention-days: 30
      - name: Publish snapshot or explicit feed failure
        run: |
          test -f docs/prediction-markets/snapshot.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/prediction-markets/snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Kalshi observation snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report incomplete observation
        if: steps.observe.outcome != 'success'
        run: exit 1
