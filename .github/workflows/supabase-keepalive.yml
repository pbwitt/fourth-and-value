name: Supabase Keepalive

# Free-tier Supabase projects auto-pause after 7 days with no API traffic.
# The NFL/NHL grading jobs already hit the database during their seasons,
# but a weekly ping year-round costs nothing and closes the gap in the
# off-season instead of finding out the tracker is paused when someone
# tries to use it.

on:
  schedule:
    - cron: '17 13 * * 1'  # every Monday, 13:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf -o /dev/null \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/bets?select=id&limit=1"
