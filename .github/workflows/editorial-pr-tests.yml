name: Editorial PR Tests

on:
  pull_request:
    paths:
      - 'scripts/editorial*.py'
      - 'scripts/analyst*'
      - 'tests/test_analyst_review.py'
      - 'config/analyst_review.json'
      - '.github/workflows/analyst-daily.yml'
      - 'scripts/editorial_templates/**'
      - 'scripts/build_props_site.py'
      - 'docs/assets/briefing-picks.js'
      - 'docs/assets/injury-context.js'
      - 'docs/assets/briefing-tracker.css'
      - 'docs/tracking/bet-tracking.js'
      - 'docs/tracking/index.html'
      - 'tests/tracker_saves.cjs'
      - 'docs/tracking/live-*.js'
      - 'tests/live_stats.cjs'
      - 'tests/grade_bets.cjs'
      - 'scripts/grade_bets.cjs'
      - '.github/workflows/grade-bets.yml'
      - 'supabase/functions/live-stats/**'
      - 'tests/briefing_picks.cjs'
      - 'tests/briefing_browser.cjs'
      - 'tests/test_editorial*.py'
      - 'scripts/line_movement.py'
      - 'tests/test_line_movement.py'
      - 'tests/editorial_permissions.cjs'
      - 'tests/editorial_dispatch.cjs'
      - 'supabase/functions/editorial-write-now/**'
      - 'supabase/editorial*.sql'
      - 'docs/editorial/*.js'
      - 'docs/editorial/inbox.html'
      - 'docs/assets/editorial.css'
      - 'tests/editorial_manual.cjs'
      - 'tests/editorial_rewrite_browser.cjs'
      - '.github/workflows/editorial*.yml'
      - 'config/editorial.json'
      - 'EDITORIAL_OPERATIONS.md'

permissions:
  contents: read

jobs:
  editorial-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_editorial*.py'
      - run: python -m unittest discover -s tests -p 'test_line_movement.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/editorial_dispatch.cjs
      - run: node tests/editorial_manual.cjs
      - run: node tests/briefing_picks.cjs
      - run: python -m unittest discover -s tests -p 'test_analyst_review.py'
      - run: node tests/tracker_saves.cjs
      - run: node tests/live_stats.cjs
      - run: node tests/grade_bets.cjs
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/editorial_rewrite_browser.cjs
      - run: node tests/briefing_browser.cjs
      - run: node tests/research_browser.cjs
      - name: Test private reader permissions in isolated PostgreSQL
        run: |
          npm install --prefix /tmp/fv-editorial-db @electric-sql/pglite@0.5.8
          FV_PGLITE=/tmp/fv-editorial-db/node_modules/@electric-sql/pglite node tests/editorial_permissions.cjs
