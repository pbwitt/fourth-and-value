name: Editorial PR Tests

on:
  pull_request:
    paths:
      - 'scripts/editorial*.py'
      - 'tests/test_editorial*.py'
      - 'config/editorial.json'
      - 'EDITORIAL_OPERATIONS.md'

permissions:
  contents: read

jobs:
  editorial-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_editorial*.py'
