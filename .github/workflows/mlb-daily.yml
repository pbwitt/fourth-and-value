name: MLB Daily Update

on:
  schedule:
    # 11:15 AM and 5:15 PM Eastern during daylight time; hourly DST shift in winter.
    - cron: '15 15,21 * * *'
  workflow_dispatch:

concurrency:
  group: mlb-daily-update
  cancel-in-progress: false

jobs:
  update-mlb:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued refreshes must include the previous run's published snapshot.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore game history and trained MLB models
        uses: actions/cache@v4
        with:
          path: |
            data/mlb/history
            data/mlb/model_data
            data/mlb/models
          key: mlb-models-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: mlb-models-v1-${{ runner.os }}-
      - name: Verify MLB math and publishing guards
        run: |
          python -m unittest discover -s tests -p 'test_mlb*.py'
          python -m unittest discover -s tests -p 'test_nba.py'
      - name: Update history and train chronological models
        id: models
        continue-on-error: true
        run: python scripts/mlb/train.py
      - name: Refresh MLB markets
        id: refresh
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.MLB_ODDS_API_KEY || secrets.ODDS_API_KEY }}
          MLB_TRAINING_FAILED: ${{ steps.models.outcome != 'success' && '1' || '0' }}
        run: python scripts/mlb/refresh.py
      - name: Validate published timestamps and season
        id: validate
        if: steps.refresh.outcome == 'success'
        run: python scripts/mlb/refresh.py --validate
      - name: Archive odds and model inputs for later review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-snapshot-${{ github.run_id }}
          path: |
            data/mlb/snapshots/
            data/mlb/history/
            data/mlb/models/
            data/mlb/model_data/manifest.json
            docs/mlb/data/validation.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Include responsible-use notices
        id: notices
        if: always()
        run: |
          python scripts/site_notices.py --scope mlb
          python -m unittest discover -s tests -p 'test_site_notices.py'
      - name: Publish MLB pages and feed status
        id: publish
        if: always() && steps.notices.outcome == 'success' && (steps.refresh.outcome == 'failure' || steps.validate.outcome == 'success')
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git add docs/mlb/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'MLB: refresh models, forecasts and market snapshot'
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo '::error::Concurrent MLB edit needs review; snapshot saved in artifacts.'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Rebuild public site
        if: always() && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        # A commit made with GITHUB_TOKEN does not automatically rebuild Pages.
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status
      - name: Report upstream model or odds failures
        if: steps.refresh.outcome == 'failure' || steps.models.outcome == 'failure'
        run: exit 1
