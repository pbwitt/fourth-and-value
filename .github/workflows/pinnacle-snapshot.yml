name: Pinnacle Snapshot

# Manual only since 2026-10-21. Pinnacle is now recorded by every core refresh at no extra
# credit cost (scripts/sharp_reference.py, artifacts/pinnacle/reference/). This optional,
# separately billed snapshot stays available for coverage reports; it never feeds a model,
# a pick or a public page (docs/model-improvement-plan.md, Step 2c).
on:
  workflow_dispatch:

concurrency:
  group: pinnacle-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.32.5
      - name: Record Pinnacle prices for our events
        id: snapshot
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY || secrets.NHL_ODDS_API_KEY || secrets.MLB_ODDS_API_KEY }}
        run: python scripts/pinnacle_snapshot.py --max-credits 250
      - name: Commit the snapshot
        run: |
          git config user.name 'Fourth & Value Research'
          git config user.email 'actions@github.com'
          git add artifacts/pinnacle/snapshots/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Research: record Pinnacle snapshot'
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo '::warning::Concurrent edit; the snapshot was not saved.'
              exit 0
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo '::warning::The snapshot was not pushed.'
      - name: Report a failed snapshot
        if: steps.snapshot.outcome != 'success'
        run: echo '::warning::Pinnacle snapshot failed; picks are unaffected.'
