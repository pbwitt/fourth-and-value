name: NHL Daily Update

on:
  schedule:
    # The shared morning workflow calls this at 7 AM.
    - cron: '30 16 * * *'
      timezone: America/New_York
  workflow_dispatch:
  workflow_call:

concurrency:
  group: analyst-reviews
  cancel-in-progress: false

jobs:
  update-nhl:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued refreshes must include the previous run's published snapshot.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-nhl.txt
      - name: Install dependencies
        run: pip install -r requirements-nhl.txt
      - name: Restore historical season summaries
        uses: actions/cache@v4
        with:
          path: |
            data/nhl/history
            data/nhl/v2/history
          key: nhl-history-v3-${{ github.run_id }}
          restore-keys: nhl-history-v3-
      - name: Verify NHL math and publishing guards
        run: |
          python -m unittest discover -s tests -p 'test_nhl*.py'
          python -m unittest discover -s tests -p 'test_nba.py'
      - name: Refresh NHL markets
        id: refresh
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY || secrets.ODDS_API_KEY }}
        run: python scripts/nhl/refresh.py
      - name: Validate published timestamps and season
        id: validate
        if: steps.refresh.outcome == 'success'
        run: python scripts/validate_nhl_freshness.py
      - name: Prepare shortlist and bounded morning research
        if: always() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/nhl/analyst.py
          python scripts/nhl/v2/decisions.py grade --cached-history --output artifacts/nhl/analyst/evaluation.json
      - name: Grade cross-market coherence signals
        if: always() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure')
        continue-on-error: true
        # Research ledger only: archived per-snapshot signals scored against official results.
        run: python scripts/nhl/v2/coherence.py grade --cached-history
      - name: Grade NHL market results
        id: market_results
        if: steps.refresh.outcome == 'success' && steps.validate.outcome == 'success'
        continue-on-error: true
        # Rebuilt from the committed run archive: last pregame snapshot per game vs. official results.
        run: python scripts/build_market_results.py --sport nhl
      - name: Archive odds and model inputs for later review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nhl-snapshot-${{ github.run_id }}
          path: |
            data/nhl/snapshots/
            data/nhl/history/
            data/nhl/v2/
            artifacts/nhl/
          retention-days: 90
          if-no-files-found: ignore
      - name: Record price movement on published picks
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        # Latest pregame quote for each recent card pick; read by the briefing.
        run: python scripts/line_movement.py --sport nhl
      - name: Include responsible-use notices
        id: notices
        if: always()
        run: |
          python scripts/site_notices.py --scope nhl
          python -m unittest discover -s tests -p 'test_site_notices.py'
      - name: Publish NHL pages and feed status
        id: publish
        if: always() && steps.notices.outcome == 'success' && (steps.refresh.outcome == 'failure' || steps.validate.outcome == 'success')
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git add docs/nhl/ artifacts/nhl/ docs/markets/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'NHL: refresh market snapshot and pages'
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo '::error::Concurrent NHL edit needs review; snapshot saved in artifacts.'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Rebuild public site
        if: always() && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        # A commit made with GITHUB_TOKEN does not automatically rebuild Pages.
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status
      - name: Report upstream odds failures
        if: steps.refresh.outcome == 'failure'
        run: exit 1
      - name: Report market results failures after publishing
        if: steps.market_results.outcome == 'failure'
        run: |
          echo '::error::NHL market results were not rebuilt; the page keeps its previous data.'
          exit 1
      - name: Report independent-model failures after publishing explicit status
        if: steps.refresh.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          state=json.load(open('docs/nhl/data/latest.json'))
          if state.get('model_error'):
              raise SystemExit(state['model_error'])
          PY
