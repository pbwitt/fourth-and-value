name: NHL Daily Update

on:
  schedule:
    # Both UTC offsets; the gate below chooses 10:30 / 16:30 America/New_York.
    - cron: '30 14,15,20,21 * * *'
  workflow_dispatch:

concurrency:
  group: nhl-daily-update
  cancel-in-progress: false

jobs:
  update-nhl:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued refreshes must include the previous run's published snapshot.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-nhl.txt
      - name: Select Eastern decision window
        id: window
        env:
          TRIGGER: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('America/New_York'))
          enabled = os.environ['TRIGGER'] != 'schedule' or now.hour in (10,16)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('enabled=' + str(enabled).lower() + '\n')
          PY
      - name: Install dependencies
        if: steps.window.outputs.enabled == 'true'
        run: pip install -r requirements-nhl.txt
      - name: Restore historical season summaries
        if: steps.window.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/nhl/history
            data/nhl/v2/history
          key: nhl-history-v3-${{ github.run_id }}
          restore-keys: nhl-history-v3-
      - name: Verify NHL math and publishing guards
        if: steps.window.outputs.enabled == 'true'
        run: |
          python -m unittest discover -s tests -p 'test_nhl*.py'
          python -m unittest discover -s tests -p 'test_nba.py'
      - name: Refresh NHL markets
        if: steps.window.outputs.enabled == 'true'
        id: refresh
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY || secrets.ODDS_API_KEY }}
        run: python scripts/nhl/refresh.py
      - name: Validate published timestamps and season
        id: validate
        if: steps.refresh.outcome == 'success'
        run: python scripts/validate_nhl_freshness.py
      - name: Prepare shortlist and bounded morning research
        if: always() && steps.window.outputs.enabled == 'true' && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/nhl/analyst.py --astra
          python scripts/nhl/v2/decisions.py grade --cached-history --output artifacts/nhl/analyst/evaluation.json
      - name: Archive odds and model inputs for later review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nhl-snapshot-${{ github.run_id }}
          path: |
            data/nhl/snapshots/
            data/nhl/history/
            data/nhl/v2/
            artifacts/nhl/
          retention-days: 90
          if-no-files-found: ignore
      - name: Include responsible-use notices
        id: notices
        if: always() && steps.window.outputs.enabled == 'true'
        run: |
          python scripts/site_notices.py --scope nhl
          python -m unittest discover -s tests -p 'test_site_notices.py'
      - name: Publish NHL pages and feed status
        id: publish
        if: always() && steps.notices.outcome == 'success' && (steps.refresh.outcome == 'failure' || steps.validate.outcome == 'success')
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git add docs/nhl/ artifacts/nhl/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'NHL: refresh market snapshot and pages'
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo '::error::Concurrent NHL edit needs review; snapshot saved in artifacts.'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Rebuild public site
        if: always() && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        # A commit made with GITHUB_TOKEN does not automatically rebuild Pages.
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status
      - name: Report upstream odds failures
        if: steps.refresh.outcome == 'failure'
        run: exit 1
      - name: Report independent-model failures after publishing explicit status
        if: steps.refresh.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          state=json.load(open('docs/nhl/data/latest.json'))
          if state.get('model_error'):
              raise SystemExit(state['model_error'])
          PY
