name: Bet Tracker offer tests
on:
  pull_request:
    paths:
      - 'docs/assets/offer-tracker.*'
      - 'docs/assets/mlb.js'
      - 'docs/assets/nba.js'
      - 'docs/assets/props.js'
      - 'docs/tracking/bet-tracking.js'
      - 'docs/tracking/live-stats.js'
      - 'scripts/mlb/site.py'
      - 'scripts/nba/site.py'
      - 'scripts/build_props_site.py'
      - 'scripts/nfl_build_totals_page.py'
      - 'tests/offer_tracker*.cjs'
      - '.github/workflows/tracker-pr-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==1.5.3 numpy==1.26.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/offer_tracker.cjs && node tests/tracker_saves.cjs && node tests/live_stats.cjs
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/offer_tracker_browser.cjs
