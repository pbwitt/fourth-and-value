name: Bet Tracker offer tests
on:
  pull_request:
    paths:
      - 'docs/assets/offer-tracker.*'
      - 'docs/assets/mlb.js'
      - 'docs/assets/nba.js'
      - 'docs/assets/props.js'
      - 'docs/assets/player-context.*'
      - 'docs/tracking/bet-tracking.js'
      - 'docs/tracking/live-stats.js'
      - 'docs/tracking/live-feeds.js'
      - 'docs/tracking/manual-bet.js'
      - 'docs/tracking/performance.js'
      - 'docs/tracking/edit-bet.*'
      - 'docs/tracking/player-stats.js'
      - 'docs/tracking/index.html'
      - 'scripts/grade_bets.cjs'
      - 'scripts/mlb/site.py'
      - 'scripts/nba/site.py'
      - 'scripts/build_props_site.py'
      - 'scripts/nfl_build_totals_page.py'
      - 'tests/offer_tracker*.cjs'
      - 'tests/manual_bet*.cjs'
      - 'tests/tracker_*.cjs'
      - 'tests/grade_bets.cjs'
      - '.github/workflows/tracker-pr-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==1.5.3 numpy==1.26.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/offer_tracker.cjs && node tests/tracker_saves.cjs && node tests/live_stats.cjs && node tests/manual_bet.cjs && node tests/tracker_performance.cjs && node tests/tracker_edits.cjs && node tests/grade_bets.cjs && node tests/tracker_player_stats.cjs
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/offer_tracker_browser.cjs
      - run: node tests/manual_bet_browser.cjs
      - run: node tests/tracker_performance_browser.cjs
      - run: node tests/tracker_edits_browser.cjs
      - run: node tests/tracker_player_stats_browser.cjs
