name: NHL model contract tests
on:
  pull_request:
    paths:
      - 'scripts/nhl/**'
      - 'scripts/validate_nhl_freshness.py'
      - 'tests/test_nhl*.py'
      - 'tests/nhl_browser.cjs'
      - 'docs/assets/nhl.js'
      - 'docs/assets/nhl-candidates.*'
      - 'docs/assets/injury-context.js'
      - 'config/nhl_analyst.json'
      - 'docs/nav.js'
      - 'models/nhl/**'
      - 'requirements-nhl.txt'
      - '.github/workflows/nhl-*.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-nhl.txt
      - run: pip install -r requirements-nhl.txt
      - run: python -m unittest discover -s tests -p 'test_nhl*.py'
      - run: python -m unittest discover -s tests -p 'test_nba.py'
      - run: python scripts/nhl/refresh.py --offline
      - run: python scripts/nhl/analyst.py
      - run: python scripts/site_notices.py --scope nhl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: NHL_BUNDLED_BROWSER=1 node tests/nhl_browser.cjs
