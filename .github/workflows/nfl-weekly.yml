name: NFL Weekly Update

on:
  schedule:
    # Weekly model refresh/review, plus game-day board refreshes.
    - cron: '0 10 * * 3'
      timezone: America/New_York
    - cron: '0 17 * * 4'
      timezone: America/New_York
    - cron: '0 8 * * 0'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      week:
        description: 'Optional upcoming regular-season week (auto-detected if empty)'
        required: false
        type: number
      generate_insights:
        description: 'Explicitly approve paid game insights for this run'
        required: false
        type: boolean
        default: false

concurrency:
  group: nfl-weekly-update
  cancel-in-progress: false

jobs:
  update-nfl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify NFL math and refresh selection
        run: python -m unittest discover -s tests -p 'test_nfl*.py'
      - name: Select upcoming week from the schedule
        id: week
        env:
          REQUESTED_WEEK: ${{ inputs.week }}
        run: |
          if [ -n "$REQUESTED_WEEK" ] && [ "$REQUESTED_WEEK" != "0" ]; then
            python scripts/prepare_nfl_refresh.py --select --week "$REQUESTED_WEEK"
          else
            python scripts/prepare_nfl_refresh.py --select
          fi
      - name: Restore historical inputs and line history
        if: steps.week.outputs.active == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/weekly_player_stats_*.parquet
            data/nfl/refresh/pbp_*.parquet
            data/nfl/lines/history/
          key: nfl-refresh-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nfl-refresh-v1-${{ runner.os }}-
      - name: Prepare current player stats and totals model
        if: steps.week.outputs.active == 'true'
        env:
          NFL_SEASON: ${{ steps.week.outputs.season }}
          NFL_WEEK: ${{ steps.week.outputs.week }}
        run: |
          python scripts/prepare_nfl_refresh.py --season "$NFL_SEASON" --week "$NFL_WEEK"
          python scripts/fetch_defensive_stats.py --season "$NFL_SEASON" --week "$NFL_WEEK"
      - name: Refresh NFL projections, prices and pages
        id: refresh
        if: steps.week.outputs.active == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.NFL_ODDS_API_KEY || secrets.MLB_ODDS_API_KEY || secrets.ODDS_API_KEY }}
          OPENAI_API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_insights && secrets.OPENAI_API_KEY || '' }}
          OPENAI_INSIGHTS_MODEL: gpt-6-astra
          APPROVE_INSIGHTS: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_insights && 'true' || 'false' }}
          NFL_SEASON: ${{ steps.week.outputs.season }}
          NFL_WEEK: ${{ steps.week.outputs.week }}
        run: |
          skip_insights=1
          if [ "$APPROVE_INSIGHTS" = "true" ]; then skip_insights=0; fi
          make --always-make monday_all SEASON="$NFL_SEASON" WEEK="$NFL_WEEK" SKIP_AI_INSIGHTS="$skip_insights"
          make --always-make nfl_totals_daily SEASON="$NFL_SEASON" WEEK="$NFL_WEEK" SKIP_AI_INSIGHTS=1
      - name: Freeze current-week pregame evidence
        id: weekly_snapshot
        if: steps.refresh.outcome == 'success' && (github.event_name != 'schedule' || github.event.schedule == '0 10 * * 3')
        env:
          NFL_SEASON: ${{ steps.week.outputs.season }}
          NFL_WEEK: ${{ steps.week.outputs.week }}
        run: |
          python scripts/nfl_weekly_review.py snapshot --season "$NFL_SEASON" --week "$NFL_WEEK"

      - name: Build previous-week review and next-week preview
        id: weekly_review
        if: steps.weekly_snapshot.outcome == 'success' && steps.week.outputs.week != '1'
        continue-on-error: true
        env:
          NFL_SEASON: ${{ steps.week.outputs.season }}
          NFL_WEEK: ${{ steps.week.outputs.week }}
        run: |
          completed=$((NFL_WEEK - 1))
          python scripts/nfl_weekly_review.py review \
            --season "$NFL_SEASON" \
            --completed-week "$completed" \
            --preview-week "$NFL_WEEK"

      - name: Verify historical Week 2 benchmark
        if: steps.weekly_snapshot.outcome == 'success'
        run: python scripts/nfl_weekly_review.py verify-week2

      - name: Preserve model inputs and run diagnostics
        if: always() && steps.week.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nfl-refresh-${{ github.run_id }}
          path: |
            data/nfl/refresh/manifest.json
            data/nfl/models/
            data/nfl/processed/
            data/nfl/predictions/
            data/nfl/lines/
            data/nfl/injuries/
            data/injuries/
            data/props/
            data/qc/
            reports/nfl-weekly/
          retention-days: 30
          if-no-files-found: ignore
      - name: Include responsible-use notices
        run: |
          python scripts/site_notices.py
          python -m unittest discover -s tests -p 'test_site_notices.py'
      - name: Publish refreshed NFL pages
        id: publish
        if: steps.refresh.outcome == 'success'
        env:
          NFL_WEEK: ${{ steps.week.outputs.week }}
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          # Page builders also maintain shared assets and discovery metadata.
          # This clean runner contains only files generated by this refresh.
          git add docs/
          if [ -d reports/nfl-weekly ]; then git add reports/nfl-weekly/; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NFL: refresh Week $NFL_WEEK projections and prices"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo '::error::Concurrent edit needs review; run artifacts are preserved.'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Rebuild public site
        if: steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status

      - name: Report weekly review failure
        if: always() && steps.week.outputs.active == 'true' && steps.week.outputs.week != '1' && steps.weekly_review.outcome == 'failure'
        run: |
          echo '::error::NFL pages refreshed, but the weekly recap/preview failed. Inspect the weekly review step and preserved artifacts.'
          exit 1
