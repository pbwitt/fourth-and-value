name: NFL Weekly Update

on:
  schedule:
    # Run at 2 PM UTC (9 AM EST / 6 AM PST) every Monday during NFL season
    - cron: '0 14 * * 1'
  workflow_dispatch:  # Allow manual triggers
    inputs:
      week:
        description: 'NFL Week Number'
        required: false
        type: number

concurrency:
  group: nfl-weekly-update
  cancel-in-progress: false

jobs:
  update-nfl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Determine week number
        id: week
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "week=${{ github.event.inputs.week }}" >> $GITHUB_OUTPUT
          else
            # Auto-detect week number using Python
            WEEK=$(python3 -c "from datetime import datetime, timezone; start = datetime(2026, 9, 9, tzinfo=timezone.utc); days = (datetime.now(timezone.utc) - start).days; print(max(1, min(days // 7 + 1, 18)))")
            echo "Auto-detected week: $WEEK"
            echo "week=$WEEK" >> $GITHUB_OUTPUT
          fi

      - name: Fetch weekly player stats
        run: |
          WEEK=${{ steps.week.outputs.week }}
          # career_baseline.py needs several prior seasons for its position
          # pools and per-player career baselines (see scripts/career_baseline.py).
          for yr in 2020 2021 2022 2023 2024 2025; do
            python3 scripts/fetch_weekly_player_stats.py --season $yr
          done
          # Current season's file won't exist yet until nflverse publishes
          # the first week's box scores - that's expected early in the
          # season, so don't fail the whole run over it.
          python3 scripts/fetch_weekly_player_stats.py --season 2026 || echo "No 2026 weekly stats published yet, will use career baseline"
          python3 scripts/fetch_defensive_stats.py --season 2026 --week $WEEK

      - name: Run NFL weekly pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          export ODDS_API_KEY="${ODDS_API_KEY}"
          export OPENAI_API_KEY="${OPENAI_API_KEY}"
          WEEK=${{ steps.week.outputs.week }}
          DATE=$(date +%Y-%m-%d)
          make monday_all SEASON=2026 WEEK=$WEEK
          echo "Grading pending NFL bets..."
          python3 scripts/grade_bets_nfl.py --date $DATE || echo "No bets to grade"
          git add docs/props/*.html docs/data/ai/*.json data/bets/bets.csv || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update NFL props for Week $WEEK - Generated with GitHub Actions"

          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
            if [ "$i" = "3" ]; then
              echo "::error::Failed to push after 3 attempts"
              exit 1
            fi
          done
