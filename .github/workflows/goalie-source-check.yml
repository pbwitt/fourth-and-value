name: Goalie source check (one-off)
# Temporary research job: finds and prints Daily Faceoff's terms of use from a GitHub
# runner (the first pass covered NHL.com, RotoWire, Left Wing Lock and the NHL API).
# Prints to the log only; no secrets, no odds credits, no repository writes. Remove
# after review.
on:
  push:
    branches: [claude/amazing-albattani-kui7sr]
    paths: ['.github/workflows/goalie-source-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find and read Daily Faceoff terms
        shell: python
        run: |
          import html, re, time, urllib.request

          UA = 'FourthAndValue-research/1.0 (+https://fourthandvalue.com)'

          def get(url):
              time.sleep(2)  # polite pacing
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': '*/*'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.geturl(), r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, url, ''
              except Exception as e:
                  return None, url, f'ERROR {type(e).__name__}: {e}'

          def text(page):
              page = re.sub(r'(?is)<(script|style|noscript)\b.*?</\1>', ' ', page)
              page = re.sub(r'(?s)<[^>]+>', '\n', page)
              lines = [' '.join(html.unescape(l).split()) for l in page.splitlines()]
              return [l for l in lines if l]

          # Candidate terms URLs: any sitemap entry mentioning terms/legal, plus common paths.
          candidates = []
          status, _, sitemap = get('https://www.dailyfaceoff.com/sitemap.xml')
          print('sitemap', status, len(sitemap))
          locs = re.findall(r'<loc>([^<]+)</loc>', sitemap)
          for loc in locs:
              if re.search(r'term|legal|condition|privacy|policy|about', loc, re.I):
                  candidates.append(loc)
          for sub in [l for l in locs if l.endswith('.xml')][:6]:
              status, _, body = get(sub)
              for loc in re.findall(r'<loc>([^<]+)</loc>', body):
                  if re.search(r'term|legal|condition|privacy', loc, re.I):
                      candidates.append(loc)
          candidates += ['https://www.dailyfaceoff.com/terms-of-use', 'https://www.dailyfaceoff.com/terms',
                         'https://www.dailyfaceoff.com/terms-of-service', 'https://www.dailyfaceoff.com/privacy-policy']
          status, _, home = get('https://www.dailyfaceoff.com/')
          for href in re.findall(r'href=["\']([^"\']+)["\']', home):
              if re.search(r'term|legal|privacy', href, re.I):
                  candidates.append(href if href.startswith('http') else 'https://www.dailyfaceoff.com' + href)
          candidates = list(dict.fromkeys(candidates))
          print('candidates:', candidates)

          words = re.compile(r'scrap|crawl|spider|robot|automat|data min|harvest|extract|commercial|'
                             r'reproduc|redistribut|license|permission|personal use|api\b|bot\b|artificial|AI\b|terms', re.I)
          for url in candidates[:8]:
              status, final, page = get(url)
              lines = text(page)
              print('\n' + '=' * 100 + f'\n{url} -> {status} {final} ({len(page)} chars, {len(lines)} lines)\n' + '=' * 100)
              if status != 200:
                  continue
              hits = [i for i, l in enumerate(lines) if words.search(l)]
              shown = set()
              for i in hits[:80]:
                  for j in range(max(0, i - 1), min(len(lines), i + 2)):
                      if j not in shown:
                          shown.add(j)
                          print(lines[j][:900])
                  print('---')
