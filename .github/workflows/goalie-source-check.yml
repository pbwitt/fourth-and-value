name: Goalie source check (one-off)
# Temporary research job: reads robots.txt, terms pages and page structure for candidate
# NHL starting-goalie sources from a GitHub runner. Prints findings to the log; writes
# nothing to the repository and uses no secrets or odds credits. Remove after review.
on:
  push:
    branches: [claude/amazing-albattani-kui7sr]
    paths: ['.github/workflows/goalie-source-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read robots.txt, terms and page structure
        shell: python
        run: |
          import html, json, re, time, urllib.request
          from urllib.parse import urljoin, urlparse

          UA = 'FourthAndValue-research/1.0 (+https://fourthandvalue.com)'

          def get(url):
              time.sleep(2)  # polite pacing
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': '*/*'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.geturl(), r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, url, ''
              except Exception as e:
                  return None, url, f'ERROR {type(e).__name__}: {e}'

          def text(page):
              page = re.sub(r'(?is)<(script|style|noscript)\b.*?</\1>', ' ', page)
              page = re.sub(r'(?s)<[^>]+>', '\n', page)
              lines = [' '.join(html.unescape(l).split()) for l in page.splitlines()]
              return [l for l in lines if l]

          def banner(title):
              print('\n' + '=' * 100 + f'\n{title}\n' + '=' * 100, flush=True)

          TERMS_WORDS = re.compile(r'scrap|crawl|spider|robot|automat|data min|harvest|extract|'
                                   r'commercial|reproduc|redistribut|api\b|bot\b|frame|aggregat', re.I)

          def terms_links(base, page):
              found = []
              for href, label in re.findall(r'(?is)<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', page):
                  label = ' '.join(re.sub(r'<[^>]+>', ' ', label).split())
                  if re.search(r'terms|conditions|legal|tos\b', href + ' ' + label, re.I):
                      found.append(urljoin(base, href))
              return list(dict.fromkeys(found))[:4]

          def report_terms(url):
              status, final, page = get(url)
              banner(f'TERMS {url} -> {status} {final} ({len(page)} chars)')
              lines = text(page)
              hits = [i for i, l in enumerate(lines) if TERMS_WORDS.search(l)]
              shown = set()
              for i in hits:
                  for j in range(max(0, i - 1), min(len(lines), i + 2)):
                      if j not in shown:
                          shown.add(j)
                          print(lines[j][:700])
                  print('---')
              if not hits:
                  print('\n'.join(lines[:80]))

          SITES = {
              'nhl.com': ('https://www.nhl.com/', ['https://www.nhl.com/info/terms-of-service']),
              'dailyfaceoff.com': ('https://www.dailyfaceoff.com/', []),
              'rotowire.com': ('https://www.rotowire.com/', []),
              'leftwinglock.com': ('https://leftwinglock.com/', []),
          }
          for name, (home, extra) in SITES.items():
              status, final, page = get(urljoin(home, '/robots.txt'))
              banner(f'ROBOTS {name} -> {status}')
              print(page[:6000])
              status, final, page = get(home)
              links = terms_links(final, page) + extra
              print(f'\nterms links found on {name} home ({status}): {links}')
              for link in list(dict.fromkeys(links))[:3]:
                  report_terms(link)

          # Data pages: what each candidate actually exposes.
          banner('DATA nhl.com lineup projections article')
          status, final, page = get('https://www.nhl.com/news/nhl-lineup-projections-2026-27-season')
          lines = text(page)
          print(status, final, len(page))
          idx = [i for i, l in enumerate(lines) if re.search(r'goalie|projected|status report|scratch|injur', l, re.I)]
          for i in idx[:40]:
              print(lines[i][:400])
          print('json data hints:', sorted(set(re.findall(r'(forge-dapi[^"\'\s<>]{0,80}|__NEXT_DATA__|application/ld\+json)', page)))[:10])

          banner('DATA dailyfaceoff starting goalies')
          status, final, page = get('https://www.dailyfaceoff.com/starting-goalies')
          print(status, final, len(page))
          m = re.search(r'(?s)<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', page)
          if m:
              data = json.loads(m.group(1))
              def walk(o, path='', depth=0):
                  if depth > 6:
                      return
                  if isinstance(o, dict):
                      for k, v in o.items():
                          if re.search(r'goal|game|status|confirm|news|source|updated', k, re.I):
                              sample = v if isinstance(v, (str, int, float, bool)) or v is None else type(v).__name__
                              print(f'{path}.{k}: {str(sample)[:120]}')
                          walk(v, f'{path}.{k}', depth + 1)
                  elif isinstance(o, list) and o:
                      print(f'{path}[]: list of {len(o)}')
                      walk(o[0], f'{path}[0]', depth + 1)
              walk(data)
          else:
              print('no __NEXT_DATA__; text sample:')
              print('\n'.join([l for l in text(page) if re.search(r'confirm|likely|unconfirmed|projected', l, re.I)][:30]))

          banner('DATA rotowire starting goalies')
          status, final, page = get('https://www.rotowire.com/hockey/starting-goalies.php')
          print(status, final, len(page))
          print('\n'.join([l for l in text(page) if re.search(r'confirm|expected|likely|subscribe|log in|sign in', l, re.I)][:30]))

          banner('DATA NHL API: does a pregame game show goalies?')
          status, final, page = get('https://api-web.nhle.com/v1/schedule/now')
          print('schedule', status)
          try:
              sched = json.loads(page)
              games = [g for day in sched.get('gameWeek', []) for g in day.get('games', [])
                       if g.get('gameState') in ('FUT', 'PRE')][:2]
          except Exception as e:
              print('schedule parse error', e); games = []
          for g in games:
              gid = g['id']
              for kind in ('landing', 'boxscore', 'right-rail'):
                  status, final, page = get(f'https://api-web.nhle.com/v1/gamecenter/{gid}/{kind}')
                  print(f'\n{gid} {kind} -> {status}, {len(page)} chars')
                  try:
                      obj = json.loads(page)
                  except Exception:
                      continue
                  print('top-level keys:', list(obj)[:40])
                  def goalie_paths(o, path=''):
                      if isinstance(o, dict):
                          for k, v in o.items():
                              p = f'{path}.{k}'
                              if re.search(r'goal(ie|tender)|starter|lineup|scratch', k, re.I):
                                  print('  ', p, '=>', json.dumps(v)[:300])
                              goalie_paths(v, p)
                      elif isinstance(o, list) and o:
                          goalie_paths(o[0], path + '[0]')
                  goalie_paths(obj)
