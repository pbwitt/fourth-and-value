name: Editorial Morning Briefing
on:
  schedule:
    - cron: '7 5 * * *'
      timezone: America/New_York
    - cron: '37 6 * * *'
      timezone: America/New_York
    - cron: '7 11,16,21 * * *'
      timezone: America/New_York
    - cron: '17 * * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      check_api:
        description: Verify the configured API key with a bounded paid probe
        type: boolean
        default: false
      refresh_briefing:
        description: Collect fresh prices/news and publish today's briefing
        type: boolean
        default: true

concurrency:
  group: editorial-publishing
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      writer_eligible: ${{ steps.plan.outputs.writer_eligible }}
      refresh_briefing: ${{ steps.plan.outputs.refresh_briefing }}
      refresh_mlb: ${{ steps.plan.outputs.refresh_mlb }}
      writer_reason: ${{ steps.plan.outputs.writer_reason }}
      eastern_time: ${{ steps.plan.outputs.eastern_time }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Plan this editorial run from current state
        id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          manual=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.refresh_briefing }}" = "true" ]; then manual=true; fi
          python scripts/editorial_schedule.py --manual-refresh "$manual"
      - name: Show planner decision
        run: |
          echo "mode=${{ steps.plan.outputs.mode }}"
          echo "writer_eligible=${{ steps.plan.outputs.writer_eligible }}"
          echo "refresh_briefing=${{ steps.plan.outputs.refresh_briefing }}"
          echo "refresh_mlb=${{ steps.plan.outputs.refresh_mlb }}"
          echo "reason=${{ steps.plan.outputs.writer_reason }}"

  refresh-mlb:
    needs: plan
    if: needs.plan.outputs.refresh_mlb == 'true'
    permissions:
      contents: write
      pages: write
    uses: ./.github/workflows/mlb-daily.yml
    secrets: inherit

  publish:
    needs: [plan, refresh-mlb]
    # Briefing/freshness still publishes after an upstream failure; writer checks data separately.
    if: always() && !cancelled() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.UPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests jinja2
      - name: Verify freshness, escaping and publication guards
        run: python -m unittest discover -s tests -p 'test_editorial*.py'
      - name: Refresh market prices and briefing
        if: needs.plan.outputs.refresh_briefing == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MLB_ODDS_API_KEY: ${{ secrets.MLB_ODDS_API_KEY }}
          NBA_ODDS_API_KEY: ${{ secrets.NBA_ODDS_API_KEY }}
          NHL_ODDS_API_KEY: ${{ secrets.NHL_ODDS_API_KEY }}
        run: python scripts/editorial.py --refresh
      - name: Check API access when explicitly requested
        id: api_check
        if: github.event_name == 'workflow_dispatch' && inputs.check_api
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/editorial_writer.py --check-api
      - name: Record current data readiness
        run: python scripts/editorial_writer.py --inspect-data
      - name: Show resilient run classification
        run: |
          echo "Editorial mode: ${{ needs.plan.outputs.mode }}"
          echo "Eastern planner time: ${{ needs.plan.outputs.eastern_time }}"
          echo "Writer reason: ${{ needs.plan.outputs.writer_reason }}"
      - name: Research and publish original analysis
        if: needs.plan.outputs.writer_eligible == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/editorial_writer.py
      - name: Verify expected writer execution
        if: always() && needs.plan.outputs.writer_eligible == 'true'
        run: python scripts/editorial_schedule.py --verify-writer --expected-writer true
      - name: Prepare owner-approved articles and homepage
        run: python scripts/editorial.py --publish-approved --receipt /tmp/editorial-receipt.json
      - name: Include responsible-use notices
        run: |
          python scripts/site_notices.py
          python -m unittest discover -s tests -p 'test_site_notices.py'
      - name: Publish public pages only
        id: push
        run: |
          git config user.name 'Fourth & Value Editorial'
          git config user.email 'actions@github.com'
          git add docs/index.html docs/briefing/ docs/editorial/articles/ docs/editorial/published.json docs/editorial/evidence/ docs/editorial/runs/ docs/editorial/budget.json docs/editorial/index.html docs/blog/index.html docs/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Editorial: publish briefing and approved articles'
            for attempt in 1 2 3; do
              if ! git pull --rebase origin main; then
                git rebase --abort || true
                echo '::error::Concurrent publication needs review. Approved drafts stay in the private queue.'
                exit 1
              fi
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
      - name: Rebuild site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status
      - name: Acknowledge successful publication
        run: python scripts/editorial.py --ack --receipt /tmp/editorial-receipt.json
      - name: Report explicit API check failure
        if: github.event_name == 'workflow_dispatch' && inputs.check_api && steps.api_check.outcome == 'failure'
        run: |
          echo '::error::Cloud API check failed. Price updates published, but writing credentials or funding require attention.'
          exit 1
      # Private ideas and drafts are never logged or uploaded as public artifacts.
      # The paid writer runs only for the morning edition or an explicit manual refresh.
