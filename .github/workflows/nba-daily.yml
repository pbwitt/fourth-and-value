name: NBA Daily Update

on:
  schedule:
    # Backup only. Supabase starts this at 6:45 AM and 5 PM Eastern (supabase/nba_scheduler.sql);
    # GitHub's own schedule can run hours late, so the gate skips a slot that already published.
    - cron: '0 7 * * *'
      timezone: America/New_York
    - cron: '15 17 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      refresh_history:
        description: 'Add recent ESPN box scores to NBA history (free)'
        type: boolean
        default: true

concurrency:
  group: nba-daily-update
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      refresh: ${{ steps.gate.outputs.refresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: gate
        name: Skip a backup start whose slot already published
        run: python scripts/nba/schedule_gate.py --event "${{ github.event_name }}"
  update-nba:
    needs: gate
    if: needs.gate.outputs.refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued refreshes must include the previous run's published snapshot.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify NBA math, grading and publishing guards
        run: python -m unittest discover -s tests -p 'test_nba*.py'
      - name: Update historical box scores
        if: github.event_name == 'schedule' || inputs.refresh_history
        # ESPN finals from the last four Eastern dates join the committed season file.
        # Markets still publish if ESPN is unreachable; saved history is kept, never invented.
        run: python scripts/nba/espn_history.py --recent 4 || echo '::warning::ESPN box scores unavailable; saved NBA history retained.'
      - name: Refresh NBA markets
        id: refresh
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.NBA_ODDS_API_KEY || secrets.ODDS_API_KEY }}
        run: python scripts/nba/pipeline.py
      - name: Grade NBA market results
        id: market_results
        if: always() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure')
        continue-on-error: true
        # Rebuilt from the committed run archive: last pregame snapshot per game vs. ESPN final box
        # scores (free). Saved results in artifacts/nba/results are reused; an odds outage does not stop it.
        run: python scripts/build_market_results.py --sport nba
      - name: Archive odds and model inputs for later review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-snapshot-${{ github.run_id }}
          path: |
            data/nba/snapshots/
          retention-days: 90
          if-no-files-found: ignore
      - name: Include responsible-use notices
        id: notices
        if: always()
        run: |
          python scripts/site_notices.py --scope nba
          python -m unittest discover -s tests -p 'test_site_notices.py'
      - name: Publish NBA pages and feed status
        id: publish
        if: always() && steps.notices.outcome == 'success'
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git add docs/nba/ docs/markets/
          if [ -d artifacts/nba ]; then git add artifacts/nba/; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'NBA: refresh market snapshot and pages'
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo '::error::Concurrent NBA edit needs review; snapshot saved in artifacts.'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Rebuild public site
        if: always() && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        # A commit made with GITHUB_TOKEN does not automatically rebuild Pages.
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status
      - name: Report upstream odds failures
        if: steps.refresh.outcome == 'failure'
        run: exit 1
      - name: Report market results failures after publishing
        if: steps.market_results.outcome == 'failure'
        run: |
          echo '::error::NBA market results were not rebuilt; the page keeps its previous data.'
          exit 1
