name: Afternoon Picks Edition

# Runs after the 4:30 p.m. NHL/MLB refresh (afternoon-refresh.yml). New picks from those
# prices, reviewed within what the morning left of the same daily allowance, with no
# discovery search; each morning pick is price-checked. The morning edition is unchanged.
on:
  workflow_dispatch:
    inputs:
      replace_card:
        description: Archive and replace today's afternoon edition
        type: boolean
        default: false
  workflow_call:
    inputs:
      refresh_results:
        type: string
        default: '{}'

# NHL refreshes and morning research serialize their reservations against one combined cap.
concurrency:
  group: analyst-reviews
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  edition:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests==2.32.5 anthropic==1.13.0
      - name: Verify selection and research boundaries
        run: |
          node tests/briefing_picks.cjs
          python -m unittest discover -s tests -p 'test_analyst_review.py'
          python -m unittest discover -s tests -p 'test_morning*.py'
      - name: Review new candidates and price-check the morning picks
        id: research
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_CODE }}
          REPLACE_CARD: ${{ inputs.replace_card || false }}
          REFRESH_RESULTS: ${{ inputs.refresh_results || '{}' }}
        run: |
          args=(--astra --afternoon-edition --refresh-results "$REFRESH_RESULTS")
          if [ "$REPLACE_CARD" = 'true' ]; then args+=(--replace-card); fi
          python scripts/analyst_review.py "${args[@]}"
      - name: Archive reproducible research packets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afternoon-research-${{ github.run_id }}
          path: artifacts/analyst/
          retention-days: 90
      - name: Publish reviews, the afternoon edition and the spending ledger
        run: |
          git config user.name 'Fourth & Value Research'
          git config user.email 'actions@github.com'
          git add docs/briefing/reviews.json docs/nhl/data/candidates.json artifacts/analyst/
          if [ -f docs/briefing/afternoon-card.json ]; then git add docs/briefing/afternoon-card.json docs/briefing/cards/; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Research: publish the afternoon picks edition'
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo '::error::Concurrent edit needs review; research is retained in artifacts.'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Rebuild public site only if this edition is not already live
        if: steps.research.outputs.edition_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_EDITION: ${{ steps.research.outputs.edition_id }}
        run: |
          if python scripts/morning_operations.py --kind afternoon --verify-live "$EXPECTED_EDITION" --attempts 1; then exit 0; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status
      - name: Verify this exact edition is live
        if: steps.research.outputs.edition_id != ''
        env:
          EXPECTED_EDITION: ${{ steps.research.outputs.edition_id }}
        run: python scripts/morning_operations.py --kind afternoon --verify-live "$EXPECTED_EDITION"
      # Once per edition (Resend idempotency key). Skipped when there is no new pick and every
      # morning pick still qualifies. Honors the owner's Morning Card unsubscribe.
      - name: Email the owner the afternoon picks
        if: steps.research.outputs.edition_id != ''
        continue-on-error: true
        env:
          EXPECTED_EDITION: ${{ steps.research.outputs.edition_id }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EDITORIAL_NOTIFY_FROM: ${{ secrets.EDITORIAL_NOTIFY_FROM }}
          EDITORIAL_NOTIFY_EMAIL: ${{ secrets.EDITORIAL_NOTIFY_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.UPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/morning_email.py --kind afternoon --edition "$EXPECTED_EDITION"
      # The closing-lines function prices each registered pick in the minutes before its
      # game, sharing snapshots with tracked bets, for the weekly closing-line report card.
      - name: Register the afternoon picks for closing prices
        if: steps.research.outputs.edition_id != ''
        continue-on-error: true
        env:
          EXPECTED_EDITION: ${{ steps.research.outputs.edition_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.UPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/pick_closes.py --kind afternoon --edition "$EXPECTED_EDITION"
      - name: Fail incomplete or unverified afternoon runs
        if: always() && !cancelled()
        env:
          RESEARCH_OUTCOME: ${{ steps.research.outcome }}
        run: |
          # Outside the 4–7 p.m. window the run publishes nothing and is not a failure.
          if [ "$RESEARCH_OUTCOME" != 'success' ]; then
            echo '::error::Afternoon research did not complete. See the archived diagnostics.'
            exit 1
          fi
