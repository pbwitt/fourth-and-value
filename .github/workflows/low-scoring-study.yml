name: Low-Scoring Study Data
# Situational low-scoring study (Technical Report FV-2026-04). Downloads the public game,
# officiating, weather and closing-total histories the study needs and commits the game tables to
# the triggering branch. Free public sources only; no paid odds request is made.
on:
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/research/low_scoring/fetch.py'
      - 'scripts/research/low_scoring/fetch-sports.json'
      - '.github/workflows/low-scoring-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sports: ${{ steps.plan.outputs.sports }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        # Sports to (re)build; the rest keep the tables already committed.
        run: echo "sports=$(jq -c . scripts/research/low_scoring/fetch-sports.json)" >> "$GITHUB_OUTPUT"
  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: low-scoring-${{ matrix.sport }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sport: ${{ fromJSON(needs.plan.outputs.sports) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests openpyxl pandas pyarrow
      - name: Restore request cache
        uses: actions/cache/restore@v4
        with:
          path: .low-scoring-cache
          key: low-scoring-cache-${{ matrix.sport }}-${{ github.run_id }}
          restore-keys: low-scoring-cache-${{ matrix.sport }}-
      - name: Build the ${{ matrix.sport }} game table
        run: python scripts/research/low_scoring/fetch.py ${{ matrix.sport }}
      - name: Save request cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .low-scoring-cache
          key: low-scoring-cache-${{ matrix.sport }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: low-scoring-${{ matrix.sport }}
          path: reports/low-scoring-2026/tables/
          retention-days: 30
  commit:
    needs: fetch
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: low-scoring-*
          path: reports/low-scoring-2026/tables/
          merge-multiple: true
      - name: Commit the game tables to the branch
        run: |
          git config user.name "Fourth & Value Research"
          git config user.email "actions@github.com"
          git add reports/low-scoring-2026/tables/
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Low-scoring study: game tables from public sources (run ${{ github.run_id }})"
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done
