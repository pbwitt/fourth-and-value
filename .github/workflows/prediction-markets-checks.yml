name: Prediction Market Checks
on:
  pull_request:
    paths:
      - 'scripts/prediction_markets/**'
      - 'scripts/*prediction_markets.py'
      - 'config/prediction_markets.json'
      - 'docs/prediction-markets/**'
      - 'docs/nav.js'
      - 'tests/*prediction_markets*'
      - '.github/workflows/prediction-markets*.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_prediction_markets.py'
      - run: python scripts/build_prediction_markets.py --check
      - run: python scripts/build_daily_process.py --check
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/prediction_markets_browser.cjs
      - run: python scripts/seo_check.py --changed
