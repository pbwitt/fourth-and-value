<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Bar chart of Pittsburgh minus 1.5 win probability under four calibration treatments. The published model gives 46.8 percent. Interpolating between the two nearest held-out audit bins gives 44.0 percent. The nearest lower bin gives 39.1 percent, essentially equal to the 39.2 percent break-even at plus 155. The nearest upper bin gives 60.9 percent.">
<rect width="1000" height="400" fill="#111823"/>
<text x="0" y="28" fill="#e7eef9" font-family="Georgia,serif" font-size="19" font-weight="600">What the audit does to a 46.8% forecast</text>
<text x="0" y="48" fill="#b8c5d6" font-family="system-ui,sans-serif" font-size="13">Same game, same +155 price. Only the calibration treatment changes.</text>
<line x1="564.5" y1="66" x2="564.5" y2="308" stroke="#8b97a8" stroke-width="2" stroke-dasharray="5 4"/>
<text x="572.5" y="80" fill="#b8c5d6" font-family="system-ui,sans-serif" font-size="12">Break-even at +155 · 39.2%</text>
<g font-family="system-ui,sans-serif" font-size="13" fill="#b8c5d6" text-anchor="end"><text x="275" y="112">Published model</text><text x="275" y="168" fill="#e7eef9" font-weight="600">Interpolated between bins</text><text x="275" y="224">Nearest lower bin (44.1%)</text><text x="275" y="280">Nearest upper bin (55.9%)</text></g>
<path d="M290 90 h327.2 a4 4 0 0 1 4 4 v26 a4 4 0 0 1 -4 4 h-327.2 z" fill="#3c4a5e"/><path d="M290 146 h307.9 a4 4 0 0 1 4 4 v26 a4 4 0 0 1 -4 4 h-307.9 z" fill="#2fa88c"/><path d="M290 202 h273.9 a4 4 0 0 1 4 4 v26 a4 4 0 0 1 -4 4 h-273.9 z" fill="#3c4a5e"/><path d="M290 258 h426.0 a4 4 0 0 1 4 4 v26 a4 4 0 0 1 -4 4 h-426.0 z" fill="#3c4a5e"/>
<g font-family="system-ui,sans-serif" font-size="13" fill="#e7eef9"><text x="631.2" y="112">46.8%<tspan fill="#b8c5d6" font-weight="400">  ·  +19.2% EV</tspan></text><text x="611.9" y="168" font-weight="600">44.0%<tspan fill="#b8c5d6" font-weight="400">  ·  +12.2% EV</tspan></text><text x="577.9" y="224">39.1%<tspan fill="#b8c5d6" font-weight="400">  ·  −0.2% EV</tspan></text><text x="730.0" y="280">60.9%<tspan fill="#b8c5d6" font-weight="400">  ·  +55.2% EV</tspan></text></g>
