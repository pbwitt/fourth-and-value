<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Dumbbell chart. Pittsburgh's bullpen RA/9 moved from 4.08 over the full season to 3.50 over the last 30 games. St. Louis moved from 4.52 to 5.62. The season gap of 0.44 runs widens to 2.12 runs in the recent window.">
<rect width="1000" height="300" fill="#111823"/>
<text x="0" y="28" fill="#e7eef9" font-family="Georgia,serif" font-size="19" font-weight="600">Bullpen runs allowed per nine innings</text>
<text x="0" y="48" fill="#b8c5d6" font-family="system-ui,sans-serif" font-size="13">The gap between these bullpens exists mostly in the last month.</text>
<g stroke="#314159" stroke-width="1">
<line x1="130" y1="78" x2="130" y2="240"/><line x1="265" y1="78" x2="265" y2="240"/><line x1="400" y1="78" x2="400" y2="240"/>
<line x1="535" y1="78" x2="535" y2="240"/><line x1="670" y1="78" x2="670" y2="240"/><line x1="805" y1="78" x2="805" y2="240"/><line x1="940" y1="78" x2="940" y2="240"/>
</g>
<g fill="#b8c5d6" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">
<text x="130" y="262">3.0</text><text x="265" y="262">3.5</text><text x="400" y="262">4.0</text><text x="535" y="262">4.5</text><text x="670" y="262">5.0</text><text x="805" y="262">5.5</text><text x="940" y="262">6.0</text>
</g>
<text x="535" y="286" fill="#b8c5d6" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">Relief-only runs allowed per 9 innings (lower is better)</text>
<g font-family="system-ui,sans-serif" font-size="14" fill="#e7eef9">
<text x="0" y="125" font-weight="600">Pittsburgh</text>
<text x="0" y="200" font-weight="600">St. Louis</text>
</g>
<line x1="265" y1="120" x2="422" y2="120" stroke="#2fa88c" stroke-width="3"/>
<circle cx="422" cy="120" r="8" fill="#111823" stroke="#2fa88c" stroke-width="2.5"/>
<circle cx="265" cy="120" r="8" fill="#2fa88c" stroke="#111823" stroke-width="2"/>
<text x="248" y="125" fill="#e7eef9" font-family="system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="end">3.50</text>
<text x="440" y="125" fill="#b8c5d6" font-family="system-ui,sans-serif" font-size="13">4.08</text>
<line x1="540" y1="195" x2="837" y2="195" stroke="#b87f2e" stroke-width="3"/>
<circle cx="540" cy="195" r="8" fill="#111823" stroke="#b87f2e" stroke-width="2.5"/>
<circle cx="837" cy="195" r="8" fill="#b87f2e" stroke="#111823" stroke-width="2"/>
<text x="523" y="200" fill="#b8c5d6" font-family="system-ui,sans-serif" font-size="13" text-anchor="end">4.52</text>
<text x="855" y="200" fill="#e7eef9" font-family="system-ui,sans-serif" font-size="13" font-weight="600">5.62</text>
<g font-family="system-ui,sans-serif" font-size="12" fill="#b8c5d6">
<circle cx="640" cy="44" r="7" fill="#111823" stroke="#8b97a8" stroke-width="2.5"/><text x="654" y="48">Full season (156 games)</text>
<circle cx="820" cy="44" r="7" fill="#8b97a8"/><text x="834" y="48">Last 30 games</text>
</g>
</svg>
